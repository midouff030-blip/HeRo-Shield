<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Area — HeRo Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050910;--side:#090f1a;--panel:#0c1422;--card:#0f1a2d;--card2:#111d32;--line:#172036;--line2:#1f2d4a;--txt:#e8eef8;--txt2:#f0f5ff;--mut:#7a8faf;--dim:#4e6080;--cy:#00e8b8;--cy2:#20f5d0;--cyg:rgba(0,232,184,.08);--cyg2:rgba(0,232,184,.14);--blu:#4d94ff;--blug:rgba(77,148,255,.10);--amber:#ffc23a;--red:#ff4d6a;--redg:rgba(255,77,106,.10);--grn:#2dd4a0;--grng:rgba(45,212,160,.12);--purp:#a78bfa;--r:16px;--rs:10px;--glow:0 0 60px -20px rgba(0,232,184,.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Chakra Petch',sans-serif;letter-spacing:-.02em;font-weight:700}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);color:var(--txt);padding:10px 13px;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 3px var(--cyg)}
::selection{background:var(--cy);color:var(--bg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:'Chakra Petch';font-weight:600;font-size:13px;border:0;border-radius:var(--rs);padding:9px 16px;cursor:pointer;transition:.18s;white-space:nowrap;letter-spacing:.01em}
.btn-cy{background:var(--cy);color:#021a14;box-shadow:0 4px 20px -6px rgba(0,232,184,.4)}.btn-cy:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-grad{background:linear-gradient(135deg,var(--cy),var(--blu));color:#021a14;box-shadow:0 6px 24px -8px rgba(0,232,184,.35)}.btn-grad:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}.btn-ghost:hover{border-color:var(--mut);background:var(--panel)}
.btn-red{background:var(--redg);color:var(--red);border:1px solid transparent}.btn-red:hover{border-color:var(--red)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn svg{width:15px;height:15px}

/* ===== SHELL ===== */
.shell{display:flex;min-height:100vh}

/* ===== SIDEBAR ===== */
.side{width:260px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:30}
.side::-webkit-scrollbar{width:4px}.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

.side-logo{padding:20px 18px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.side-logo svg{width:36px;height:36px;flex-shrink:0;filter:drop-shadow(0 4px 12px rgba(0,232,184,.3))}
.side-logo .nm{font-family:'Chakra Petch';font-weight:700;font-size:16px;line-height:1.15}
.side-logo .nm b{color:var(--cy)}
.side-logo .sub{color:var(--dim);font-size:11px;margin-top:2px;letter-spacing:.03em}

.nav-label{padding:16px 16px 6px;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-family:'Chakra Petch';font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:0;border:0;color:var(--mut);font-family:Inter;font-size:13.5px;font-weight:500;padding:9px 12px;border-radius:10px;cursor:pointer;transition:.12s}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.nav a.act,.nav button.act{background:var(--cyg2);color:var(--cy)}
.nav .ic{width:18px;height:18px;flex-shrink:0;opacity:.8}
.nav a.act .ic,.nav button.act .ic{opacity:1}
.nav .badge-n{margin-left:auto;background:var(--cyg);color:var(--cy);font-size:10px;font-family:'Chakra Petch';font-weight:700;padding:2px 7px;border-radius:999px}

/* server list */
.srvlist{padding:2px 8px 8px;display:flex;flex-direction:column;gap:1px;flex:1}
.srvbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:0;border:0;color:var(--mut);font-size:13px;font-weight:500;padding:8px 12px;border-radius:10px;cursor:pointer;transition:.12s;font-family:Inter}
.srvbtn:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.srvbtn.act{background:rgba(255,255,255,.05);color:var(--txt)}
.srvbtn .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srvbtn .arr{transition:.2s;color:var(--dim);font-size:10px;opacity:.7}
.srvbtn.open .arr{transform:rotate(90deg);color:var(--cy)}
.subnav{display:none;flex-direction:column;gap:0;margin:2px 0 4px 14px;padding-left:10px;border-left:2px solid var(--line)}
.subnav.open{display:flex}
.subnav button{display:flex;align-items:center;gap:8px;background:0;border:0;color:var(--dim);font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:Inter;text-align:left;width:100%;transition:.12s}
.subnav button:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.subnav button.act{color:var(--cy);background:var(--cyg)}

.side-bot{margin-top:auto;border-top:1px solid var(--line);padding:8px}

/* ===== MAIN ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;background:rgba(5,9,16,.88);backdrop-filter:blur(16px);z-index:20}
.crumb{color:var(--dim);font-size:13px;font-family:'Chakra Petch';font-weight:500}
.crumb b{color:var(--txt);font-weight:600}
.crumb span{color:var(--dim)}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}.chip img{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.content{padding:24px 26px 60px;max-width:1280px;flex:1}

.page-h{margin-bottom:20px}
.page-h h1{font-size:22px;font-weight:700}
.page-h p{color:var(--mut);font-size:13px;margin:4px 0 0}

/* banner */
.banner{height:100px;border-radius:var(--r);background:linear-gradient(110deg,#0a1628 0%,#0f2240 50%,#0a1628 100%);border:1px solid var(--line);margin-bottom:16px;overflow:hidden;position:relative;display:flex;align-items:center;padding:0 28px;gap:16px}
.banner:after{content:"";position:absolute;inset:0;background:radial-gradient(450px 180px at 90% 50%,rgba(0,232,184,.12),transparent 70%);pointer-events:none}
.banner:before{content:"";position:absolute;inset:0;background:radial-gradient(300px 150px at 10% 50%,rgba(77,148,255,.08),transparent 60%);pointer-events:none}
.banner .bsvg{width:52px;height:52px;position:relative;filter:drop-shadow(0 4px 16px rgba(0,232,184,.3))}
.banner .btxt{position:relative}
.banner .btxt h2{font-size:18px;margin-bottom:2px}
.banner .btxt p{color:var(--mut);font-size:12.5px}

/* cards grid */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;transition:.2s}
.card:hover{border-color:var(--line2)}
.card .ch{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:11.5px;margin-bottom:10px;font-family:'Chakra Petch';font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card .ch .ci{width:15px;height:15px;opacity:.7}
.card .big{font-family:'Chakra Petch';font-weight:700;font-size:20px;line-height:1.1;color:var(--txt2)}
.card .small{color:var(--dim);font-size:11.5px;margin-top:4px}
.badge{font-family:'Chakra Petch';font-weight:600;font-size:10.5px;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.badge.on{background:var(--grng);color:var(--grn)}.badge.off{background:var(--redg);color:var(--red)}.badge.free{background:var(--cyg);color:var(--cy)}
.keymask{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;letter-spacing:1.5px;color:var(--dim);word-break:break-all}
.row-btns{display:flex;gap:6px;margin-top:10px}

/* analytics */
.analytics{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.analytics .ah{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.analytics .ah h3{font-size:15px}.analytics .ah p{color:var(--mut);font-size:12px;margin:3px 0 0}
.seg{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{background:0;border:0;color:var(--dim);font-size:11.5px;padding:5px 12px;border-radius:7px;cursor:pointer;font-family:'Chakra Petch';font-weight:600;transition:.12s}
.seg button:hover{color:var(--mut)}
.seg button.act{background:var(--cyg2);color:var(--cy)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.metric .ml{color:var(--dim);font-size:11px;margin-bottom:5px;font-family:'Chakra Petch';font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.metric .mv{font-family:'Chakra Petch';font-weight:700;font-size:28px}
.metric .mv.cy{color:var(--cy)}.metric .mv.rd{color:var(--red)}.metric .mv.blu{color:var(--blu)}.metric .mv.purp{color:var(--purp)}

/* tables / panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0;margin-bottom:14px;overflow:hidden}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line);font-family:'Chakra Petch';font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.panel-h .cnt{margin-left:auto;background:var(--cyg);color:var(--cy);font-size:10.5px;padding:2px 8px;border-radius:999px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.015)}
th{font-family:'Chakra Petch';font-weight:600;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--panel)}
.tag{font-family:'Chakra Petch';font-weight:600;font-size:10.5px;padding:3px 8px;border-radius:999px}
.tag.ban{background:var(--redg);color:var(--red)}.tag.kick{background:rgba(255,194,58,.12);color:var(--amber)}.tag.log{background:var(--blug);color:var(--blu)}
.key{font-family:ui-monospace,monospace;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:10.5px;color:var(--cy)}
.proof{width:100px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block;transition:.15s}
.proof:hover{border-color:var(--cy)}
.empty{color:var(--dim);text-align:center;padding:36px 20px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.dot.on{background:var(--grn);box-shadow:0 0 8px var(--grn)}.dot.off{background:var(--dim)}

.logrow{display:flex;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.logrow:last-child{border-bottom:0}
.logrow:hover{background:rgba(255,255,255,.015)}
.logrow .t{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11.5px;font-family:ui-monospace,monospace}

/* download page */
.dl-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}
.dl-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.dl-circle{width:140px;height:140px;margin:20px auto;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;position:relative;transition:.2s;background:radial-gradient(110px at 50% 40%,var(--cyg),transparent)}
.dl-circle:hover{border-color:var(--cy);transform:translateY(-3px);box-shadow:var(--glow)}
.dl-circle:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--line);opacity:.4}
.dl-circle svg{width:36px;height:36px;color:var(--cy)}
.dl-circle span{position:absolute;bottom:30px;font-family:'Chakra Petch';font-weight:600;font-size:12.5px;color:var(--cy)}
.step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--cyg2);color:var(--cy);display:grid;place-items:center;font-family:'Chakra Petch';font-weight:700;font-size:12px;flex-shrink:0}
.step .st{font-family:'Chakra Petch';font-weight:600;font-size:13.5px;margin-bottom:4px}
.step .sd{color:var(--mut);font-size:12.5px}
pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;overflow-x:auto;font-size:12px;color:var(--cy);margin:6px 0 0;font-family:ui-monospace,monospace}

/* config page */
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cfg-section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.cfg-section h3{font-size:14.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cfg-section h3 svg{width:18px;height:18px;color:var(--cy);opacity:.8}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:12px}
.cfg-row:last-child{border-bottom:0}
.cfg-row .lbl{font-size:13px;font-weight:500}
.cfg-row .lbl small{display:block;color:var(--dim);font-size:11px;font-weight:400;margin-top:1px}
.cfg-row .val{font-family:'Chakra Petch';font-weight:600;font-size:13px;color:var(--cy);text-align:right;white-space:nowrap}
.cfg-row .val.red{color:var(--red)}.cfg-row .val.amber{color:var(--amber)}.cfg-row .val.grn{color:var(--grn)}
.toggle{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:default;flex-shrink:0}
.toggle.on{background:var(--cy)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on::after{left:19px}
.det-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.det-row:last-child{border-bottom:0}
.det-row .nm{flex:1;font-weight:500}
.det-row .act{font-family:'Chakra Petch';font-weight:600;font-size:11px;padding:3px 8px;border-radius:999px}
.det-row .act.ban{background:var(--redg);color:var(--red)}.det-row .act.kick{background:rgba(255,194,58,.12);color:var(--amber)}.det-row .act.log{background:var(--blug);color:var(--blu)}

/* login */
.center{min-height:80vh;display:grid;place-items:center;text-align:center}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:48px 44px;max-width:420px;width:100%;box-shadow:var(--glow)}
.login-box h1{font-size:24px;margin:18px 0 8px}
.login-box p{color:var(--mut);font-size:13.5px;margin-bottom:24px}
.btn-discord{background:#5865F2;color:#fff;font-size:14px;padding:12px 24px;width:100%}
.btn-discord:hover{background:#4752c4}
.btn-discord svg{width:20px;height:20px}

.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--cy);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.lv{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:90;cursor:zoom-out;backdrop-filter:blur(6px)}.lv.on{display:grid}.lv img{max-width:92vw;max-height:92vh;border-radius:10px}
.hamb{display:none;background:0;border:0;color:var(--txt);cursor:pointer;padding:4px}

@media(max-width:920px){
  .side{position:fixed;left:-270px;z-index:60;transition:.25s ease}.side.open{left:0}
  .hamb{display:block}.cards,.metrics,.cfg-grid{grid-template-columns:1fr 1fr}.dl-grid{grid-template-columns:1fr}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;display:none;backdrop-filter:blur(2px)}.scrim.on{display:block}
}
@media(max-width:560px){.cards,.metrics,.cfg-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5l8-3z" fill="url(#g)"/><path d="M8.5 12l2.5 2.5 4.5-5.2" stroke="#021a14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="4" y1="2" x2="20" y2="22"><stop stop-color="#00e8b8"/><stop offset="1" stop-color="#4d94ff"/></linearGradient></defs></svg>
      <div><div class="nm">HeRo <b>Shield</b></div><div class="sub">Customer Area</div></div>
    </div>

    <div class="nav-label">Menu</div>
    <div class="nav">
      <button data-nav="home" onclick="go('#/')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</button>
      <button data-nav="redeem" onclick="go('#/redeem')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 5H3v14h18V5z"/><path d="M3 10h18"/></svg>Redeem</button>
      <button data-nav="download" onclick="go('#/download')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Download</button>
      <button data-nav="cfglib" onclick="go('#/config')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Configuration</button>
    </div>

    <div class="nav-label">My Servers</div>
    <div class="srvlist" id="srvlist"><div style="padding:10px 12px;color:var(--dim);font-size:12px">Chargement…</div></div>

    <div class="side-bot">
      <div class="nav">
        <a href="https://discord.gg/" target="_blank"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4.4A17 17 0 0015.6 3l-.3.5a12 12 0 013.7 1.9 15.8 15.8 0 00-13.9 0A12 12 0 018.7 3.5L8.4 3A17 17 0 004 4.4 18 18 0 001 16.9a17 17 0 005.2 2.6l.4-.6a11 11 0 01-1.8-.9l.4-.3a12 12 0 0010.3 0l.4.3a11 11 0 01-1.8.9l.4.6A17 17 0 0023 16.9 18 18 0 0020 4.4zM9.3 14.5c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7zm5.4 0c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7z"/></svg>Support Discord</a>

function qesc(s){return esc(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

function dur(s){s=Number(s)||0;var h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?(h+'h '+m+'m'):(m+'m');}
function isOn(ls){return ls&&(Date.now()-new Date(ls).getTime()<180000);}
async function api(p,o){try{var r=await fetch('/api/'+p,{credentials:'same-origin',...(o||{})});if(r.status===401){ME=null;return{unauth:true};}return await r.json();}catch(e){return{neterr:true};}}
function go(h){if(location.hash===h)route();else location.hash=h;toggleSide(0);}
function toggleSide(on){document.getElementById('side').classList.toggle('open',!!on);document.getElementById('scrim').classList.toggle('on',!!on);}

window.cp=function(txt,btn){try{navigator.clipboard.writeText(txt);var o=btn.textContent;btn.textContent='Copié ✓';btn.style.color='var(--grn)';setTimeout(function(){btn.textContent=o;btn.style.color='';},1600);}catch(e){}};

/* ===== AUTH ===== */

   '<div class="cfg-grid"><div class="panel" style="padding:22px"><h3 style="font-size:14px;margin-bottom:14px"><svg style="width:16px;height:16px;color:var(--cy);vertical-align:middle;margin-right:6px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Créer un nouveau serveur</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="c_name" placeholder="Nom du serveur (ex: Strada Roleplay)" style="flex:1;min-width:240px"><button class="btn btn-cy" id="c_btn">Générer la clé</button></div><div id="c_out" style="margin-top:14px"></div></div>'+

  document.getElementById('c_btn').onclick=async function(){
    var name=document.getElementById('c_name').value.trim();
    if(!name){document.getElementById('c_out').innerHTML='<span style="color:var(--amber)">⚠ Entre un nom de serveur.</span>';return;}
    this.textContent='…';this.disabled=true;
    var r=await api('connect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name})});

        '<div style="color:var(--mut);font-size:13px;margin-bottom:8px">Colle ceci dans ton <b>config.lua</b> puis redémarre :</div><pre>'+esc(snip)+'</pre>'+
        '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-cy btn-sm" onclick="cp(window.__snip,this)">📋 Copier la config</button><button class="btn btn-ghost btn-sm" onclick="ME.__loaded=false;go(\'#/\')">← Voir mes serveurs</button></div>';
    } else { document.getElementById('c_out').innerHTML='<span style="color:var(--red)">✕ '+esc(r.error||'Erreur')+'</span>'; }
  };
}

      '<div class="card"><div class="ch"><svg class="ci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/></svg>Server Status<span class="badge '+(on?'on':'off')+'" style="margin-left:auto">'+(on?'Online':'Offline')+'</span></div><div class="big">'+esc(sv.name||name)+'</div><div class="small">HeRo Shield v1.1.0</div></div>'+

      '<div class="card"><div class="ch"><svg class="ci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>License Key</div><div class="keymask" id="keymask">'+mask+'</div><div class="row-btns"><button class="btn btn-ghost btn-sm" id="kshow">👁 Show</button><button class="btn btn-ghost btn-sm" onclick="cp(window.__srvkey,this)">📋 Copy</button></div></div>'+
      '<div class="card"><div class="ch"><svg class="ci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Licence<span class="badge free" style="margin-left:auto">FREE</span></div><div class="big">∞</div><div class="small">Gratuit à vie — aucune limite</div></div>'+
    '</div>'+
    '<div class="analytics"><div class="ah"><div><h3>Server Analytics</h3><p>Vue en temps réel de ton serveur.</p></div><div class="seg"><button class="act">Aujourd\'hui</button><button>7 jours</button><button>30 jours</button></div></div>'+
      '<div class="metrics">'+
        '<div class="metric"><div class="ml">Joueurs actuels</div><div class="mv cy">'+(on?(sv.online||0):0)+'<span style="font-size:13px;color:var(--dim)"> / '+(sv.max||0)+'</span></div></div>'+
        '<div class="metric"><div class="ml">Joueurs bannis</div><div class="mv rd">'+(st.bans||0)+'</div></div>'+
        '<div class="metric"><div class="ml">Pic joueurs (24h)</div><div class="mv blu">'+(sv.max||'—')+'</div></div>'+
        '<div class="metric"><div class="ml">Joueurs connus</div><div class="mv purp">'+(st.players||0)+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="serverView(\''+qesc(name)+'\',\'dash\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg> Rafraîchir</button><button class="btn btn-red btn-sm" onclick="delServer(\''+qesc(name)+'\',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg> Supprimer</button></div>';
  }

  function bansHTML(){var b=d.bans||[];
    return '<div class="panel"><div class="panel-h"><svg style="width:16px;height:16px;color:var(--red)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93l14.14 14.14"/></svg>Bans & preuves<span class="panel-h cnt">'+b.length+'</span></div>'+
    (b.length?'<div style="overflow-x:auto"><table><thead><tr><th>Joueur</th><th>Raison</th><th>Détail</th><th>Preuve</th><th>Date</th></tr></thead><tbody>'+
      b.map(function(x){var img=x.screenshot?('<img class="proof" src="'+esc(x.screenshot)+'" onclick="zoom(\''+esc(x.screenshot)+'\')">'):'<span style="color:var(--dim)">—</span>';
      return '<tr><td><b>'+esc(x.player_name||'?')+'</b><div class="key" style="margin-top:3px">'+esc(x.identifier||'')+'</div></td><td><span class="tag '+(x.type==='kick'?'kick':x.type==='log'?'log':'ban')+'">'+esc(x.reason||x.type||'-')+'</span></td><td style="color:var(--mut);max-width:200px">'+esc(x.detail||'-')+'</td><td>'+img+'</td><td style="color:var(--dim);white-space:nowrap">'+when(x.created_at)+'</td></tr>';}).join('')+
      '</tbody></table></div>':'<div class="empty">Aucun ban enregistré. ✅</div>')+'</div>';}

  function playersHTML(){var p=d.players||[];
    return '<div class="panel"><div class="panel-h"><svg style="width:16px;height:16px;color:var(--blu)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Joueurs<span class="panel-h cnt">'+p.length+'</span></div>'+
    (p.length?'<div style="overflow-x:auto"><table><thead><tr><th>Joueur</th><th>Temps de jeu</th><th>Statut</th><th>Dernière connexion</th></tr></thead><tbody>'+
      p.map(function(x){return '<tr><td><b>'+esc(x.name||'?')+'</b><div class="key" style="margin-top:3px">'+esc(x.identifier||'')+'</div></td><td style="font-family:\'Chakra Petch\';font-weight:600">'+dur(x.playtime_sec)+'</td><td><span class="dot '+(x.online?'on':'off')+'"></span>'+(x.online?'en ligne':'hors ligne')+'</td><td style="color:var(--dim)">'+when(x.last_seen)+'</td></tr>';}).join('')+
      '</tbody></table></div>':'<div class="empty">Aucun joueur enregistré.</div>')+'</div>';}

  function logsHTML(){var l=d.logs||[];
    return '<div class="panel"><div class="panel-h"><svg style="width:16px;height:16px;color:var(--amber)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>Logs<span class="panel-h cnt">'+l.length+'</span></div>'+
    (l.length?l.map(function(x){return '<div class="logrow"><span class="t">'+when(x.created_at)+'</span><span class="tag log">'+esc(x.type||'')+'</span><span style="flex:1;color:var(--mut)">'+esc(x.detail||'')+'</span></div>';}).join(''):'<div class="empty">Aucun log.</div>')+'</div>';}

  function cfgHTML(){
    var dets=[{n:'God Mode',a:'ban'},{n:'Infinite Stamina',a:'kick'},{n:'Noclip',a:'kick'},{n:'Super Jump',a:'kick'},{n:'Speed Hack',a:'kick'},{n:'Aimbot',a:'kick'},{n:'Trigger Spam',a:'kick'},{n:'Invisible',a:'kick'},{n:'Vehicle Boost',a:'kick'},{n:'Infinite Ammo',a:'kick'},{n:'Explosions',a:'ban'},{n:'External Menu',a:'ban'},{n:'Command Abuse',a:'ban'},{n:'Weapon Blacklist',a:'kick'}];
    return '<div class="cfg-grid">'+
      '<div class="cfg-section"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg>Détections actives</h3>'+dets.map(function(d){return '<div class="det-row"><div class="toggle on"></div><span class="nm">'+d.n+'</span><span class="act '+d.a+'">'+d.a.toUpperCase()+'</span></div>';}).join('')+'</div>'+
      '<div><div class="cfg-section"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Mode</h3>'+
        '<div class="cfg-row"><span class="lbl">DetectOnly</span><span class="val amber">ON</span></div>'+
        '<div class="cfg-row"><span class="lbl">Screenshots</span><span class="val grn">ON</span></div>'+
        '<div class="cfg-row"><span class="lbl">DefaultAction</span><span class="val red">ban</span></div>'+
      '</div>'+
      '<div class="cfg-section"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20v-3"/></svg>Seuils</h3>'+
        '<div class="cfg-row"><span class="lbl">Max Health</span><span class="val">200</span></div>'+
        '<div class="cfg-row"><span class="lbl">Max Armor</span><span class="val">100</span></div>'+
        '<div class="cfg-row"><span class="lbl">Noclip Speed</span><span class="val">22.0</span></div>'+
        '<div class="cfg-row"><span class="lbl">Speed On Foot</span><span class="val">18.0</span></div>'+
        '<div class="cfg-row"><span class="lbl">Explosion/min</span><span class="val">12</span></div>'+
      '</div></div></div>'+
      '<div class="panel" style="padding:16px"><div style="color:var(--dim);font-size:12.5px">Modifie ces valeurs dans <span class="key">config.lua</span> de ton resource HeRoShield.</div></div>';
  }

  var SUBLBL={dash:'Server Dashboard',players:'Players',bans:'Bans',logs:'Logs',cfg:'Configuration'};
  var body=sub==='bans'?bansHTML():sub==='players'?playersHTML():sub==='logs'?logsHTML():sub==='cfg'?cfgHTML():headDash();
  var topbtns='<div style="display:flex;gap:6px;margin-left:auto"><button class="btn btn-ghost btn-sm" onclick="serverView(\''+qesc(name)+'\',\''+sub+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg> Rafraîchir</button><button class="btn btn-red btn-sm" onclick="delServer(\''+qesc(name)+'\',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg> Supprimer</button></div>';
  if(sub!=='dash'){
    body='<div class="page-h" style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><h1>'+esc(SUBLBL[sub])+'</h1><p><span class="dot '+(on?'on':'off')+'"></span>'+esc(sv.name||name)+'</p></div>'+topbtns+'</div>'+body;
  }
  app.innerHTML=body;
  window.__srvkey=d.key||'';
  var ksh=document.getElementById('kshow');
  if(ksh){var shown=false;ksh.onclick=function(){shown=!shown;document.getElementById('keymask').textContent=shown?(d.key||'—'):('•'.repeat(24));ksh.textContent=shown?'🙈 Hide':'👁 Show';};}
}
window.serverView=serverView;
window.delServer=async function(name,ev){if(ev){ev.stopPropagation();ev.preventDefault();}if(!confirm('Supprimer "'+name+'" et toutes ses données ?'))return;var r=await api('delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name})});if(r.ok){OPEN=null;ME.__loaded=false;go('#/');}else alert(r.error||'Erreur');};

/* ===== ROUTER ===== */
function route(){
  var h=location.hash;
  var ms=h.match(/^#\/s\/([^\/]+)(?:\/(\w+))?/);
  if(ms)return serverView(decodeURIComponent(ms[1]),ms[2]||'dash');
  if(h==='#/redeem')return redeem();
  if(h==='#/download')return download();
  if(h==='#/config')return configLib();
  return home();
}
window.addEventListener('hashchange',route);
route();
</script>
